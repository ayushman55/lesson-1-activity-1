<!DOCTYPE html>
<html>
<head>
    <title>Semantic HTML Example</title>
</head>
<body>

    <header>
        <h1>My Website</h1>
    </header>

    <nav>
        <a href="#">Home</a> |
        <a href="#">About</a> |
        <a href="#">Contact</a>
    </nav>

    <section>
        <h2>Welcome</h2>
        <p>This is a semantic HTML example.</p>
    </section>

    <article>
        <h2>Latest News</h2>
        <p>HTML5 introduced semantic elements for better structure.</p>
    </article>

    <footer>
        <p>&copy; 2026 My Website</p>
    </footer>

</body>
</html>
