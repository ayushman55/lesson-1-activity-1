<!DOCTYPE html>
<html>
<head>
    <title>Div, Section, and Span Example</title>
</head>
<body>

    <div style="border:1px solid black; padding:10px;">
        <h1>Welcome</h1>
        <p>This content is inside a <b>div</b> element.</p>
    </div>

    <section>
        <h2>About HTML</h2>
        <p>
            HTML is used to create web pages.
            <span style="color:red;">This text is highlighted using the span tag.</span>
        </p>
    </section>

    <section>
        <h2>Contact</h2>
        <p>Email: student@example.com</p>
    </section>

</body>
</html>
